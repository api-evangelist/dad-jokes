aid: dad-jokes
name: Dad Jokes (icanhazdadjoke)
description: >-
  icanhazdadjoke is a free REST API providing access to the internet's largest
  selection of dad jokes. It offers random joke retrieval, a searchable joke
  database, Slack slash command integration, Discord bot support, and plain-text
  or JSON responses — all with no authentication required.
