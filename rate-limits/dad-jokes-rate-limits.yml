method: generated
name: Dad Jokes (icanhazdadjoke) Rate Limits
description: >-
  icanhazdadjoke does not publish formal rate-limit thresholds in its
  documentation. The API is a free community service and asks consumers to
  behave responsibly by setting a descriptive custom User-Agent header so the
  operator can identify integrations and reach out if needed.
url: https://icanhazdadjoke.com/api
rateLimits:
  - plan: Free
    requests: unspecified
    period: unspecified
    notes: >-
      No documented rate-limit numbers. As a courtesy to the operator (C653
      Labs / Brett Langdon), consumers should set a custom User-Agent header
      identifying their application, contact email, and a link to the project.
      Example: MyApp/1.0 (https://myapp.example; contact@myapp.example)
searchLimits:
  - parameter: limit
    max: 30
    default: 20
    description: >-
      The /search endpoint accepts a `limit` query parameter capped at 30 jokes
      per page, defaulting to 20. Pagination is supported via the `page`
      parameter.
guidance:
  - Set a descriptive User-Agent header on every request.
  - Avoid aggressive polling; cache results client-side where possible.
  - Use the search endpoint's pagination rather than fetching all jokes at once.
